<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="description" content="Request a Reel Creator feature.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <title>Feature request — Reel Creator</title>
  <link rel="stylesheet" href="/site.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-head">
    <a class="brand" href="/help">reelcreator</a>
    <a class="btn ghost" href="/help">Help</a>
  </header>
  <main id="main" class="page">
    <div class="page-head"><div class="page-head-copy"><h1>Feature request</h1><p class="page-head-sub">Tell us the job you are trying to finish. We read these.</p></div></div>
    <form class="settings-card" data-support="feature" style="max-width:640px">
      <label class="field"><span>Name</span><input class="input" name="name" autocomplete="name" maxlength="80"></label>
      <label class="field"><span>Email</span><input class="input" name="email" type="email" autocomplete="email" required></label>
      <label class="field"><span>Title</span><input class="input" name="title" required maxlength="80"></label>
      <label class="field"><span>Details</span><textarea class="input" name="message" required minlength="8" maxlength="5000"></textarea></label>
      <div class="hp" aria-hidden="true"><label>Company<input name="company" tabindex="-1" autocomplete="off"></label></div>
      <button class="btn primary" type="submit">Send request</button>
    </form>
  </main>
  <script type="module" src="/forms.js"></script>
</body>
</html>
