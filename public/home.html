<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My projects · Reel Creator</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/site.css">
</head>
<body>
  <header class="site-head">
    <a class="brand" href="/app"><span class="brand-mark">RC</span>Reel Creator</a>
    <div class="head-actions">
      <span class="who" id="who"></span>
      <button class="btn ghost" id="btnSignOut" type="button">Sign out</button>
    </div>
  </header>

  <main class="page">
    <div class="page-head">
      <h1>My projects</h1>
      <a class="btn primary" href="/app/new">New project</a>
    </div>
    <div class="error" id="error" role="alert"></div>
    <div id="list"></div>
  </main>

  <script type="module">
    import { $, api, escapeHtml, timeAgo, mountAccount } from "/site.js";

    let projects = [];

    function card(p) {
      const isHtml = p.sourceType === "html" && (!p.templateId || p.templateId === "custom-html");
      const thumb = isHtml
        ? `<div class="html-tile">HTML REEL</div>`
        : `<img src="/templates/${encodeURIComponent(p.templateId)}/preview.svg" alt="" onerror="this.remove()">`;
      const kind = p.sourceType === "html" ? "Custom HTML" : p.templateId;
      const exported = p.lastOutput
        ? `<a href="${escapeHtml(p.lastOutput)}" download>Download latest</a> <span class="muted">· ${p.exportCount} export${p.exportCount === 1 ? "" : "s"}</span>`
        : `<span class="muted">Not exported yet</span>`;
      const href = `/app/projects/${p.id}`;
      return `
        <article class="pcard" data-id="${p.id}">
          <a class="pthumb" href="${href}" aria-label="Open ${escapeHtml(p.name)}">${thumb}</a>
          <div class="pbody">
            <a class="pname" href="${href}" title="${escapeHtml(p.name)}">${escapeHtml(p.name)}</a>
            <div class="pmeta">${escapeHtml(kind)} · edited ${timeAgo(p.updatedAt)}</div>
            <div class="pexport">${exported}</div>
            <div class="pactions">
              <button class="btn sm ghost" data-act="rename" type="button">Rename</button>
              <button class="btn sm ghost" data-act="duplicate" type="button">Duplicate</button>
              <button class="btn sm ghost danger" data-act="delete" type="button">Delete</button>
            </div>
          </div>
        </article>`;
    }

    function render() {
      $("list").innerHTML = projects.length
        ? `<div class="grid">${projects.map(card).join("")}</div>`
        : `<div class="empty"><h2>Create your first reel</h2>
             <p>Start from a template or upload an HTML reel you already have.</p>
             <a class="btn primary lg" href="/app/new">New project</a></div>`;
    }

    async function load() {
      projects = await api("/api/projects");
      render();
    }

    $("list").addEventListener("click", async (e) => {
      const btn = e.target.closest("button[data-act]");
      if (!btn) return;
      const id = btn.closest(".pcard").dataset.id;
      const p = projects.find((x) => x.id === id);
      $("error").textContent = "";
      try {
        if (btn.dataset.act === "rename") {
          const name = prompt("Project name", p.name);
          if (!name || !name.trim() || name.trim() === p.name) return;
          await api(`/api/projects/${id}`, { method: "PUT", body: JSON.stringify({ name: name.trim() }) });
        } else if (btn.dataset.act === "duplicate") {
          await api(`/api/projects/${id}/duplicate`, { method: "POST", body: "{}" });
        } else if (btn.dataset.act === "delete") {
          if (!confirm(`Delete “${p.name}”? This removes the project and its HTML files. Exported MP4s you've downloaded are not affected.`)) return;
          await api(`/api/projects/${id}`, { method: "DELETE" });
        }
        await load();
      } catch (err) {
        $("error").textContent = err.message;
      }
    });

    mountAccount().then(load).catch((e) => ($("error").textContent = e.message));
  </script>
</body>
</html>
