<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Device Mockup</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #000; overflow: hidden; }
  body { user-select: none; }
  #stage { position: absolute; left: 50%; top: 50%; width: 540px; height: 960px; overflow: hidden; transform-origin: 50% 50%;
    color: var(--fg); font-family: var(--fontBody); background: var(--bg); }
  .abs { position: absolute; }
  h1, h2, .head { font-family: var(--fontHead); font-weight: var(--heavy); letter-spacing: -.01em; }

  #copy { left: 30px; width: 480px; text-align: center; z-index: 3; }
  #eyebrow { display: inline-block; font-size: 13px; font-weight: 700; letter-spacing: .12em; color: var(--primary);
    padding: 6px 12px; border-radius: 99px; background: color-mix(in srgb, var(--primary) 16%, transparent); margin-bottom: 14px; }
  #headline { font-size: 40px; line-height: 1.1; }
  #headline span { color: var(--primary); }
  #subhead { margin-top: 12px; font-size: 18px; font-weight: 600; color: var(--muted); line-height: 1.4; }

  #persp { left: 0; top: 0; width: 540px; height: 960px; perspective: 1600px; z-index: 2; }
  #device { position: absolute; left: 0; top: 0; transform-origin: 50% 50%; transform-style: preserve-3d; }
  .shell { position: absolute; left: 0; top: 0;
    box-shadow: 0 50px 90px rgba(0,0,0,.38), inset 0 0 0 2px rgba(255,255,255,.08); }
  .shell.graphite { background: linear-gradient(145deg, #3A3D4A, #111217); }
  .shell.silver { background: linear-gradient(145deg, #F2F3F6, #C4C7CF); box-shadow: 0 50px 90px rgba(20,24,40,.28), inset 0 0 0 2px rgba(255,255,255,.6); }
  .shell.accent { background: linear-gradient(145deg, var(--primary), color-mix(in srgb, var(--primary) 45%, #000)); }
  .shell.lid { background: #0C0C0E; box-shadow: 0 50px 90px rgba(0,0,0,.38), 0 0 0 3px #2A2C33; }
  .shell.lid.silver { box-shadow: 0 50px 90px rgba(20,24,40,.28), 0 0 0 3px #C9CCD3; }
  .shell.none { background: transparent; box-shadow: var(--shadow), 0 0 0 1px var(--cardBorder); }
  .screen { position: absolute; overflow: hidden; background: #000; }
  .screen img, .screen video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  .screen.contain img, .screen.contain video { object-fit: contain; }
  .cam { position: absolute; background: #000; z-index: 2; }
  .base { position: absolute; border-radius: 4px 4px 22px 22px; }
  .base.graphite { background: linear-gradient(180deg, #4A4D59, #1A1B21); }
  .base.silver, .base.accent { background: linear-gradient(180deg, #E9EAEE, #A9ACB5); }
  .base i { position: absolute; left: 50%; top: 0; width: 150px; height: 9px; margin-left: -75px; border-radius: 0 0 10px 10px;
    background: rgba(0,0,0,.18); }
</style>
</head>
<body>
<div id="stage">
  <div id="copy" class="abs">
    <div id="eyebrow"></div>
    <h1 id="headline"></h1>
    <div id="subhead"></div>
  </div>
  <div id="persp" class="abs"><div id="device"></div></div>
</div>
<script src="../_shared/kit.js"></script>
<script>
const { $, esc, set, prog, lerp, ease } = Kit;
const D = Kit.data({
  media: "", mediaFit: "cover", videoOffset: 0, length: 10,
  device: "iphone", finish: "graphite", motion: "float", deviceSize: 100,
  showText: true, textPosition: "top", eyebrow: "NEW", headline: "See it in action", subhead: "Say what your app does in one line",
  font: "Manrope", theme: "dark", primary: "#34C759", secondary: "#0A84FF", background: "#0E0F13", bgStyle: "glow",
});

const stage = $("stage");
Kit.theme(stage, D);
Kit.fit(stage);

const DUR = Math.max(3, Math.min(60, Number(D.length) || 10));
const dark = D.theme === "dark";

/* ---------- Device geometry (device px) ---------- */
// s = [x, y, w, h, radius] of the screen inside the shell
const DEV = {
  iphone: { w: 414, h: 868, r: 64, s: [12, 12, 390, 844, 52], cam: "island" },
  android: { w: 408, h: 884, r: 46, s: [10, 10, 388, 864, 38], cam: "hole" },
  ipad: { w: 664, h: 924, r: 44, s: [22, 22, 620, 880, 22], cam: "dot" },
  macbook: { w: 900, h: 584, r: 24, s: [24, 24, 852, 532, 8], cam: "notch", base: { w: 1040, h: 30 } },
  none: { w: 390, h: 844, r: 44, s: [0, 0, 390, 844, 44], cam: null },
};
const kind = DEV[D.device] ? D.device : "iphone";
const G = DEV[kind];
const finish = ["graphite", "silver", "accent"].includes(D.finish) ? D.finish : "graphite";
const totalW = G.base ? G.base.w : G.w;
const totalH = G.h + (G.base ? G.base.h - 4 : 0);

const dev = $("device");
dev.style.width = `${totalW}px`;
dev.style.height = `${totalH}px`;
const ox = (totalW - G.w) / 2;

const shell = document.createElement("div");
shell.className = `shell ${kind === "none" ? "none" : kind === "macbook" ? `lid ${finish}` : finish}`;
Object.assign(shell.style, { left: `${ox}px`, width: `${G.w}px`, height: `${G.h}px`, borderRadius: `${G.r}px` });
dev.appendChild(shell);

const [sx, sy, sw, sh, sr] = G.s;
const screen = document.createElement("div");
screen.className = "screen" + (D.mediaFit === "contain" ? " contain" : "");
Object.assign(screen.style, { left: `${ox + sx}px`, top: `${sy}px`, width: `${sw}px`, height: `${sh}px`, borderRadius: `${sr}px` });
dev.appendChild(screen);

if (G.cam) {
  const cam = document.createElement("div");
  cam.className = "cam";
  const c = {
    island: [ox + G.w / 2 - 61, 23, 122, 36, 18],
    hole: [ox + G.w / 2 - 9, 24, 18, 18, 9],
    dot: [ox + G.w / 2 - 5, 8, 10, 10, 5],
    notch: [ox + G.w / 2 - 70, sy, 140, 20, "0 0 10px 10px"],
  }[G.cam];
  Object.assign(cam.style, { left: `${c[0]}px`, top: `${c[1]}px`, width: `${c[2]}px`, height: `${c[3]}px`,
    borderRadius: typeof c[4] === "number" ? `${c[4]}px` : c[4] });
  if (G.cam === "dot") cam.style.background = "#1B1C22";
  dev.appendChild(cam);
}
if (G.base) {
  const base = document.createElement("div");
  base.className = `base ${finish}`;
  Object.assign(base.style, { left: "0px", top: `${G.h - 4}px`, width: `${G.base.w}px`, height: `${G.base.h}px` });
  base.innerHTML = "<i></i>";
  dev.appendChild(base);
}

/* ---------- Screen content ---------- */
const isVideo = /\.(mp4|webm|mov|m4v)(\?|#|$)/i.test(D.media || "");

/** Placeholder for tablet / laptop screens: a simple dashboard in the accent color. */
function placeholderWide(w, h) {
  const bg = dark ? "#121318" : "#F5F6FA", card = dark ? "#1E2028" : "#FFFFFF";
  const fg = dark ? "#FFFFFF" : "#15161A", mu = dark ? "#5C5F6B" : "#C9CCD6", p = D.primary;
  const side = Math.round(w * 0.2), pad = Math.round(w * 0.03), cw = (w - side - pad * 4) / 3;
  const bars = [0.5, 0.75, 0.6, 0.9, 0.7, 1, 0.8].map((v, i) => {
    const bh = (h * 0.32) * v, bx = side + pad * 2 + i * ((w - side - pad * 4) / 7);
    return `<rect x="${bx}" y="${h * 0.86 - bh}" width="${(w - side - pad * 4) / 7 - 10}" height="${bh}" rx="6" fill="${p}" opacity="${i === 5 ? 1 : 0.4}"/>`;
  }).join("");
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${h}"><rect width="${w}" height="${h}" fill="${bg}"/>
    <rect width="${side}" height="${h}" fill="${card}"/>
    ${[0, 1, 2, 3, 4].map((k) => `<rect x="${pad}" y="${pad * 2 + k * 40}" width="${side - pad * 2}" height="16" rx="8" fill="${k === 0 ? p : mu}"/>`).join("")}
    <rect x="${side + pad}" y="${pad}" width="${w * 0.25}" height="22" rx="10" fill="${fg}"/>
    ${[0, 1, 2].map((k) => `<rect x="${side + pad + k * (cw + pad)}" y="${pad * 2 + 30}" width="${cw}" height="${h * 0.18}" rx="14" fill="${card}"/>
      <rect x="${side + pad * 2 + k * (cw + pad)}" y="${pad * 3 + 30}" width="${cw * 0.5}" height="14" rx="7" fill="${k === 0 ? p : mu}"/>`).join("")}
    <rect x="${side + pad}" y="${h * 0.44}" width="${w - side - pad * 2}" height="${h * 0.5}" rx="16" fill="${card}"/>${bars}</svg>`;
  return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
}

let vid = null;
let vidReady = Promise.resolve();
if (isVideo) {
  vid = document.createElement("video");
  Object.assign(vid, { muted: true, playsInline: true, loop: true, autoplay: true, preload: "auto", src: D.media });
  vid.setAttribute("muted", "");
  vid.setAttribute("playsinline", "");
  vidReady = new Promise((r) => {
    if (vid.readyState >= 1) return r();
    vid.addEventListener("loadedmetadata", r, { once: true });
    vid.addEventListener("error", r, { once: true });
    setTimeout(r, 15000);
  });
  screen.appendChild(vid);
} else {
  const img = document.createElement("img");
  img.src = D.media || (sw / sh < 0.6 ? Kit.placeholderScreen(0, D.primary, dark) : placeholderWide(sw, sh));
  screen.appendChild(img);
}

/** Recording time for reel time t: offset, then loop. */
function videoTime(t) {
  const d = vid.duration;
  if (!d || !Number.isFinite(d)) return 0;
  const v = t + (Number(D.videoOffset) || 0);
  return ((v % d) + d) % d;
}

/* ---------- Layout ---------- */
const showText = D.showText !== false && (D.headline || D.subhead || D.eyebrow);
const textTop = D.textPosition !== "bottom";
$("eyebrow").textContent = D.eyebrow || "";
$("eyebrow").style.display = D.eyebrow ? "" : "none";
$("headline").innerHTML = Kit.accentLast(D.headline || "");
$("subhead").textContent = D.subhead || "";
$("copy").style.display = showText ? "" : "none";

const copyH = $("copy").offsetHeight;
const areaTop = showText && textTop ? 70 + copyH + 40 : 56;
const areaBottom = showText && !textTop ? 960 - 70 - copyH - 40 : 904;
$("copy").style.top = `${textTop ? 70 : 960 - 70 - copyH}px`;

const size = Math.max(0.6, Math.min(1.1, (Number(D.deviceSize) || 100) / 100));
const S = Math.min(480 / totalW, (areaBottom - areaTop) / totalH) * size;
const DX = (540 - totalW) / 2;
const DY = (areaTop + areaBottom) / 2 - totalH / 2;

/* ---------- Animation ---------- */
function motion(t) {
  switch (D.motion) {
    case "tilt": {
      const p = ease.inOut(prog(t, 0.4, DUR));
      return `rotateY(${lerp(-24, 16, p)}deg) rotateX(${lerp(10, 4, p)}deg)`;
    }
    case "zoom":
      return `scale(${lerp(0.94, 1.06, prog(t, 0, DUR))})`;
    case "orbit":
      return `translateY(${Math.sin(t * 1.2) * 6}px) rotateY(${Math.sin(t * 0.7) * 18}deg) rotateX(${Math.cos(t * 0.7) * 7}deg)`;
    case "static":
      return "";
    default:
      return `translateY(${Math.sin(t * 1.4) * 8}px) rotate(${Math.sin(t * 0.9) * 1.2}deg)`;
  }
}

function render(t) {
  Kit.renderBg(t);
  const enter = ease.spring(prog(t, 0.05, 1.0));
  set(dev, ease.out(prog(t, 0, 0.3)),
    `translate(${DX}px, ${DY + (1 - enter) * 140}px) scale(${S * lerp(0.92, 1, enter)}) ${motion(t)}`);

  const c = ease.out(prog(t, 0.25, 0.6));
  set($("copy"), c, `translateY(${(1 - ease.spring(prog(t, 0.25, 1.1))) * (textTop ? 18 : -18)}px)`);
}

Kit.start(DUR, render);

/* ---------- Seeking: exact for export, smooth for live preview ---------- */
if (vid) {
  const nextPaint = () => new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
  function seekExact(t) {
    return vidReady
      .then(() => new Promise((res) => {
        vid.pause();
        const target = videoTime(t);
        if (Math.abs(vid.currentTime - target) < 0.001 && vid.readyState >= 2) return res();
        const done = () => { clearTimeout(timer); res(); };
        const timer = setTimeout(done, 5000);
        vid.addEventListener("seeked", done, { once: true });
        vid.currentTime = target;
      }))
      .then(nextPaint);
  }

  // The editor calls setTime every animation frame while playing, and once per scrub otherwise
  let lastCall = 0, lastT = -1, idle = 0;
  function followPreview(t) {
    const now = performance.now();
    const playing = now - lastCall < 120 && t > lastT && t - lastT < 0.5;
    lastCall = now;
    lastT = t;
    if (!vid.duration) return;
    const target = videoTime(t);
    if (playing) {
      if (vid.paused) vid.play().catch(() => {});
      const drift = Math.abs(vid.currentTime - target);
      if (drift > 0.25 && drift < vid.duration - 0.25) vid.currentTime = target;
    } else {
      vid.pause();
      vid.currentTime = target;
    }
    clearTimeout(idle);
    idle = setTimeout(() => {
      vid.pause();
      vid.currentTime = videoTime(lastT);
    }, 160);
  }

  const base = window.__reel.setTime;
  window.__reel.setTime = (t) => {
    base(t);
    if (window.__reelExport) return seekExact(t);
    followPreview(t);
  };
}
</script>
</body>
</html>
