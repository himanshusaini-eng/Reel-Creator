<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>App Reviews</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #000; overflow: hidden; }
  body { user-select: none; }
  #stage { position: absolute; left: 50%; top: 50%; width: 540px; height: 960px; overflow: hidden; transform-origin: 50% 50%;
    color: var(--fg); font-family: var(--fontBody); background: var(--bg); }
  .abs { position: absolute; }
  .head { font-family: var(--fontHead); font-weight: var(--heavy); letter-spacing: -.01em; }

  #headline { left: 30px; top: 96px; width: 480px; text-align: center; font-size: 36px; line-height: 1.12; z-index: 3; }
  #headline span { color: var(--primary); }
  #rating { left: 0; top: 250px; width: 540px; text-align: center; z-index: 3; transform-origin: 50% 0; }
  #score { font-size: 132px; line-height: 1; font-variant-numeric: tabular-nums; }
  #bigStars { display: flex; justify-content: center; gap: 8px; margin-top: 14px; }
  #ratingLabel { margin-top: 14px; font-size: 18px; font-weight: 700; color: var(--muted); }
  .star { position: relative; display: inline-block; }
  .star svg { display: block; }
  .star .fill { position: absolute; left: 0; top: 0; overflow: hidden; }

  #cards { z-index: 4; }
  #cards.list { left: 36px; top: 300px; width: 468px; display: flex; flex-direction: column; gap: 16px; }
  #cards.stack .card, #cards.single .card { position: absolute; left: 36px; top: 450px; width: 468px; }
  .card { background: var(--card); border: 1px solid var(--cardBorder); border-radius: 26px; padding: 22px 24px; box-shadow: var(--shadow);
    backdrop-filter: blur(14px); }
  .who { display: flex; align-items: center; gap: 12px; }
  .ava { width: 46px; height: 46px; border-radius: 50%; color: #fff; display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 18px; flex: none; }
  .who b { display: block; font-size: 17px; font-weight: 800; }
  .who small { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin-top: 2px; }
  .who .stars { margin-left: auto; display: flex; gap: 2px; }
  .quote { margin-top: 14px; font-size: 20px; line-height: 1.42; font-weight: 600; }
  .single .quote { font-size: 27px; line-height: 1.36; }
  .single .card { padding: 28px 28px 30px; }

  #endLogo { left: 200px; top: 196px; width: 140px; height: 140px; border-radius: 34px; overflow: hidden; box-shadow: var(--shadow); z-index: 5; }
  #endName { left: 20px; top: 360px; width: 500px; text-align: center; font-size: 40px; z-index: 5; }
  #chip { left: 0; top: 422px; width: 540px; display: flex; justify-content: center; z-index: 5; }
  #chip div { display: flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 99px; background: var(--card);
    border: 1px solid var(--cardBorder); font-size: 16px; font-weight: 700; box-shadow: var(--shadow); }
  #cta { left: 90px; top: 512px; width: 360px; height: 64px; border-radius: 20px; background: var(--primary); color: #fff; z-index: 5;
    display: flex; align-items: center; justify-content: center; font-size: 21px; font-weight: 800;
    box-shadow: 0 16px 36px color-mix(in srgb, var(--primary) 45%, transparent); }
  #stores { left: 60px; top: 606px; width: 420px; display: flex; gap: 12px; z-index: 5; }
  #foot { left: 0; top: 880px; width: 540px; text-align: center; font-size: 16px; font-weight: 700; color: var(--muted); z-index: 5; }
</style>
</head>
<body>
<div id="stage">
  <div id="headline" class="abs head"></div>
  <div id="rating" class="abs">
    <div id="score" class="head">0.0</div>
    <div id="bigStars"></div>
    <div id="ratingLabel"></div>
  </div>
  <div id="cards" class="abs"></div>
  <div id="endLogo" class="abs"></div>
  <div id="endName" class="abs head"></div>
  <div id="chip" class="abs"><div><span id="chipStars"></span><span id="chipText"></span></div></div>
  <div id="cta" class="abs"></div>
  <div id="stores" class="abs"></div>
  <div id="foot" class="abs"></div>
</div>
<script src="../_shared/kit.js"></script>
<script>
const { $, esc, set, prog, lerp, ease, clamp } = Kit;
const D = Kit.data({
  headline: "Loved by 50,000+ people", rating: 4.9, ratingLabel: "Average from 12,000+ ratings",
  reviewCount: "3", reviewSeconds: 1.8, layout: "list", starColor: "#FFB800",
  review1: "Exactly what I was looking for. Setup took two minutes and it just works.", name1: "Priya S.", source1: "App Store",
  review2: "I use it every single day, and every update makes it better.", name2: "Marcus T.", source2: "Google Play",
  review3: "Clean, fast and easy to use. It replaced three other apps for me.", name3: "Elena R.", source3: "App Store",
  appName: "Your App", logoUrl: "", ctaText: "Join them — it's free", showStores: true, footer: "@yourapp",
  font: "Manrope", theme: "light", primary: "#34C759", secondary: "#0A84FF", background: "#F4FAF6", bgStyle: "glow",
});

const stage = $("stage");
Kit.theme(stage, D);
Kit.fit(stage);

const STAR = "M12 2.6l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.4l-5.9 3.3 1.3-6.6-4.9-4.6 6.6-.8z";
const emptyStar = Kit.isDark(D.background) || D.theme === "dark" ? "rgba(255,255,255,.18)" : "rgba(0,0,0,.12)";
const starEl = (size) => `<span class="star"><svg width="${size}" height="${size}" viewBox="0 0 24 24"><path d="${STAR}" fill="${emptyStar}"/></svg>
  <span class="fill"><svg width="${size}" height="${size}" viewBox="0 0 24 24"><path d="${STAR}" fill="${D.starColor}"/></svg></span></span>`;
const fillStars = (els, value) => els.forEach((el, i) => (el.querySelector(".fill").style.width = `${clamp(value - i) * 100}%`));

const RATING = clamp(Number(D.rating) || 5, 0, 5);
$("headline").innerHTML = Kit.accentLast(D.headline);
$("bigStars").innerHTML = Array.from({ length: 5 }, () => starEl(44)).join("");
const bigStars = [...$("bigStars").children];
$("ratingLabel").textContent = D.ratingLabel;

const N = clamp(Number(D.reviewCount) || 3, 1, 3);
const RS = Math.max(0.8, Number(D.reviewSeconds) || 1.8);
const layout = ["list", "stack", "single"].includes(D.layout) ? D.layout : "list";
const R0 = 2.6, TEND = R0 + N * RS + 0.6, DUR = +(TEND + 3.4).toFixed(2);
const avaColors = [D.primary, D.secondary, "#FF9F0A"];

$("cards").className = "abs " + layout;
$("cards").innerHTML = Array.from({ length: N }, (_, i) => {
  const name = D["name" + (i + 1)] || "Happy user";
  const initials = name.split(/\s+/).map((w) => w[0]).join("").slice(0, 2).toUpperCase();
  return `<div class="card"><div class="who"><div class="ava" style="background:${avaColors[i]}">${esc(initials)}</div>
    <div><b>${esc(name)}</b><small>${esc(D["source" + (i + 1)] || "")}</small></div>
    <div class="stars">${Array.from({ length: 5 }, () => starEl(18)).join("")}</div></div>
    <div class="quote">“${esc(D["review" + (i + 1)] || "")}”</div></div>`;
}).join("");
const cards = [...$("cards").children];
cards.forEach((c) => fillStars([...c.querySelectorAll(".star")], 5));

$("endLogo").innerHTML = Kit.logoHTML(D);
$("endName").textContent = D.appName;
$("chipStars").innerHTML = starEl(20);
$("chipStars").querySelector(".fill").style.width = "100%";
$("chipText").textContent = `${RATING.toFixed(1)} · ${D.ratingLabel.replace(/^average from\s*/i, "")}`;
$("cta").textContent = D.ctaText;
$("stores").innerHTML = Kit.storesHTML();
$("foot").textContent = D.footer;

function render(t) {
  Kit.renderBg(t);
  const out = ease.inOut(prog(t, TEND - 0.3, TEND + 0.2));
  set($("headline"), ease.out(prog(t, 0.1, 0.4)) * (1 - out), `translateY(${16 * (1 - ease.spring(prog(t, 0.1, 0.8)))}px)`);

  // Rating counts up, then docks under the headline while reviews come in
  const dock = ease.inOut(prog(t, R0 - 0.4, R0 + 0.1));
  const listDock = layout === "list" ? 1 : 0;
  set($("rating"), ease.out(prog(t, 0.4, 0.7)) * (1 - out) * (1 - dock * listDock),
    `translateY(${lerp(0, layout === "list" ? -120 : -60, dock)}px) scale(${lerp(1, 0.62, dock)})`);
  const val = RATING * ease.out(prog(t, 0.5, 2.0));
  $("score").textContent = val.toFixed(1);
  fillStars(bigStars, val);

  // List is centred in the space under the headline once its height (fonts) is known
  if (layout === "list") $("cards").style.top = `${Math.max(220, 575 - $("cards").offsetHeight / 2)}px`;

  cards.forEach((c, i) => {
    const a = R0 + i * RS;
    const pin = ease.spring(prog(t, a, a + 0.7));
    const o = ease.out(prog(t, a, a + 0.25));
    if (layout === "list") {
      const side = i % 2 ? 1 : -1;
      set(c, o * (1 - out), `translateX(${(1 - pin) * 120 * side}px) rotate(${(1 - pin) * 4 * side}deg) scale(${1 - out * 0.05})`);
    } else if (layout === "stack") {
      const above = Math.max(0, Math.min(N - 1, Math.floor((t - R0) / RS)) - i); // cards stacked on top of this one
      const settle = ease.inOut(prog(t, a + RS, a + RS + 0.4));
      const depth = above > 0 ? above - 1 + settle : 0;
      set(c, o * (1 - out), `translateY(${(1 - pin) * 520 - depth * 26}px) scale(${1 - depth * 0.06})`);
      c.style.zIndex = i;
      c.style.filter = depth ? `brightness(${1 - depth * 0.06})` : "none";
    } else {
      const leave = i === N - 1 ? 0 : ease.inOut(prog(t, a + RS - 0.25, a + RS + 0.15));
      set(c, o * (1 - leave) * (1 - out), `translateX(${(1 - pin) * 300 - leave * 360}px) rotate(${(1 - pin) * 6 - leave * 6}deg)`);
    }
  });

  const e0 = TEND + 0.1;
  set($("endLogo"), ease.out(prog(t, e0, e0 + 0.25)), `scale(${lerp(0.6, 1, ease.spring(prog(t, e0, e0 + 0.8)))})`);
  set($("endName"), ease.out(prog(t, e0 + 0.15, e0 + 0.4)), `translateY(${16 * (1 - ease.spring(prog(t, e0 + 0.15, e0 + 0.9)))}px)`);
  set($("chip"), ease.out(prog(t, e0 + 0.3, e0 + 0.55)), `scale(${lerp(0.8, 1, ease.spring(prog(t, e0 + 0.3, e0 + 1)))})`);
  const ctaIn = ease.spring(prog(t, e0 + 0.5, e0 + 1.2));
  const pulse = t > e0 + 1.3 ? 1 + 0.03 * Math.max(0, Math.sin((t - e0 - 1.3) * 5)) : 1;
  set($("cta"), ease.out(prog(t, e0 + 0.5, e0 + 0.7)), `translateY(${(1 - ctaIn) * 24}px) scale(${pulse})`);
  set($("stores"), D.showStores !== false ? ease.out(prog(t, e0 + 0.75, e0 + 1)) : 0,
    `translateY(${(1 - ease.spring(prog(t, e0 + 0.75, e0 + 1.4))) * 22}px)`);
  set($("foot"), ease.out(prog(t, e0 + 0.9, e0 + 1.2)));
}

Kit.start(DUR, render);
</script>
</body>
</html>
